# Keeps GitHub Actions (SHA-pinned), the toolchain image digest,
# and the Julia packages (Pkg) of each implemented project.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (Julia 1.13) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # Julia packages of 00-hello-world (workspace Project.toml files and Manifest.toml).
  - package-ecosystem: julia
    directory: /00-hello-world
    schedule:
      interval: weekly
    commit-message:
      prefix: build
